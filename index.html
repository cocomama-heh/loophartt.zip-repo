<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Love mo ba ako? ❤️</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Floating Hearts -->
    <div id="hearts"></div>

    <!-- Sparkles -->
    <div id="sparkles"></div>

    <!-- Background Blur -->
    <div class="background"></div>

    <!-- Main Card -->
    <div class="container">

        <img
            src="https://media.tenor.com/FSI2WWHS8oMAAAAj/tkthao219-bubududu.gif"
            alt="Cute Bear"
            class="gif">

        <h1 id="title">Love mo ba ako?</h1>

        <p class="subtitle">
            Please choose wisely...
        </p>

        <div class="buttons">

            <button id="yesBtn">
                YES 
            </button>

            <button id="noBtn">
                NO 
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
